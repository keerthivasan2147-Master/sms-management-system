<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sales Management System (SMS) | Enterprise Suite</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Next-Generation Enterprise Sales Management System featuring interactive reporting, transaction lifecycle management, and real-time analytics.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="dx-viewport app-dark-theme">
  <app-root></app-root>

  <!-- ============================================================ -->
  <!-- Chat Widget Configuration                                    -->
  <!-- Set a flag to false to disable that widget at any time       -->
  <!-- Widget layout (bottom-right, stacked from bottom up):        -->
  <!--   Position 1 (20px)  → SiteAnswerAI                         -->
  <!--   Position 2 (100px) → Tawk.to                              -->
  <!--   Position 3 (top navbar) → Built-in SMS AI Chat            -->
  <!-- ============================================================ -->
  <script type="text/javascript">
    var CHAT_CONFIG = {
      enableTawkTo: true,        // Set to false to disable Tawk.to
      enableSiteAnswerAI: true   // Set to false to disable SiteAnswerAI
      // Note: Built-in SMS AI Chat is toggled via the "AI On/Off" button in the top navbar
    };
  </script>

  <!-- ── Widget Positioning Overrides ─────────────────────────── -->
  <!-- Tawk.to sits 100px from bottom; SiteAnswerAI stays at 20px  -->
  <style>
    /* Tawk.to minimized bubble — push up so it clears SiteAnswerAI */
    #tawkchat-minified-wrapper,
    .tawk-min-container,
    iframe[title="chat widget"] {
      bottom: 100px !important;
    }

    /* Tawk.to open chat window — also offset upward */
    #tawkchat-container,
    .tawk-chat-panel {
      bottom: 100px !important;
    }

    /* Fallback: target any Tawk iframe by src pattern */
    iframe[src*="tawk.to"] {
      bottom: 100px !important;
    }
  </style>

  <!-- Tawk.to Chat Widget -->
  <script type="text/javascript">
  if (CHAT_CONFIG.enableTawkTo) {
    var Tawk_API = Tawk_API || {};
    var Tawk_LoadStart = new Date();

    // Use Tawk API to set the widget offset from bottom
    Tawk_API.customStyle = {
      zIndex: 1000,
      visibility: {
        desktop: { position: 'br', xOffset: 20, yOffset: 90 },
        mobile:  { position: 'br', xOffset: 15, yOffset: 90 }
      }
    };

    (function(){
      var s1 = document.createElement("script"),
          s0 = document.getElementsByTagName("script")[0];
      s1.async = true;
      s1.src = 'https://embed.tawk.to/6aca2d2298b9c934c10c4787/1k4is0ju4';
      s1.charset = 'UTF-8';
      s1.setAttribute('crossorigin', '*');
      s0.parentNode.insertBefore(s1, s0);
    })();
  }
  </script>
  <!-- End of Tawk.to Script -->

  <!-- SiteAnswerAI Chat Widget (stays at default bottom: 20px) -->
  <script type="text/javascript">
  if (CHAT_CONFIG.enableSiteAnswerAI) {
    (function(){
      var s = document.createElement("script");
      s.src = 'https://www.siteanswerai.com/widget/bfc44a9b-ba2f-4923-b4e5-3e02d37c7daf/embed.js';
      s.async = true;
      document.head.appendChild(s);
    })();
  }
  </script>
  <!-- End of SiteAnswerAI Script -->

</body>
</html>
