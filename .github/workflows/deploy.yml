name: Deploy SMS System to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PROJECT_PATH: './SMS.API'
  ANGULAR_PROJECT_PATH: './sms-app'
  AZURE_WEBAPP_NAME: 'sms-api-app'
  AZURE_WEBAPP_PACKAGE_PATH: './SMS.API/publish'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Deploy .NET Core API
  # ─────────────────────────────────────────
  deploy-api:
    name: Build & Deploy API
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT_PATH }}

      - name: Build API
        run: dotnet build ${{ env.API_PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  # ─────────────────────────────────────────
  # JOB 2: Build & Deploy Angular Frontend
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.ANGULAR_PROJECT_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.ANGULAR_PROJECT_PATH }}

      - name: Build Angular (production)
        run: npx ng build --configuration production
        working-directory: ${{ env.ANGULAR_PROJECT_PATH }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '${{ env.ANGULAR_PROJECT_PATH }}/dist/sms-app/browser'
          skip_app_build: true
